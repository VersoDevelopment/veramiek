version: '3'
services:
  web:
    image: nginx:alpine
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: ./api
    env_file: ./api/.env
    restart: unless-stopped
    expose:
      - "3001"
