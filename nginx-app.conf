# Voorkant van de nieuwe Veramiek-site (Next.js).
#
# Structuur: NGINX Proxy Manager (SSL) -> deze container -> Next-container
# op :3000, met /api/ naar de bestaande Express-API. Alles loopt daardoor over
# hetzelfde domein, zodat de browser nooit cross-origin hoeft en de CORS-lijst
# in server.js met rust gelaten kan worden.
#
# Dezelfde container bedient zowel het stagingdomein als (na de cutover)
# veramiek.nl. De twee maps hieronder regelen het verschil: staging zit achter
# een wachtwoord en mag niet geindexeerd worden.

map $host $site_auth {
    default          "Veramiek proefversie";
    veramiek.nl      off;
    www.veramiek.nl  off;
}

map $host $robots_tag {
    default          "noindex, nofollow, noarchive";
    veramiek.nl      "";
    www.veramiek.nl  "";
}

# Welke Next-container het antwoord geeft.
#
# Bewust `default` op productie en alleen het stagingdomein op de proefversie,
# en niet andersom: gaat er iets mis met deze map of staat de preview-container
# niet aan, dan valt alles terug op de live site in plaats van bezoekers op een
# proefversie te laten landen.
#
# Zolang veramiek-next-preview-1 niet draait geeft het stagingdomein een 502.
# Dat is de bedoeling: die container bestaat alleen tijdens een revisieronde.
map $host $next_upstream {
    default                       "veramiek-next-1:3000";
    veramiek.versodevelopment.nl  "veramiek-next-preview-1:3000";
}

# Let op: nginx erft add_header NIET over zodra een location-blok zelf een
# add_header zet. Daarom staat het headerblok hieronder herhaald in elk
# location-blok dat eigen headers toevoegt.

server {
    listen 80;
    server_name _;

    # ── www naar het kale domein ──
    # www.veramiek.nl gaf een 200 met dezelfde inhoud als veramiek.nl. De
    # canonical in de HTML wees al naar het kale domein, dus Google koos meestal
    # goed, maar "meestal" is geen afspraak: twee bereikbare adressen voor
    # dezelfde pagina splitsen links en crawlbudget. Een 301 maakt het hard.
    # Staat boven de auth: het stagingdomein raakt dit blok niet.
    if ($host = www.veramiek.nl) {
        return 301 https://veramiek.nl$request_uri;
    }

    # Uploads via de admin gaan door dit blok heen (limiet in de API is 10 MB).
    client_max_body_size 12m;

    # Statische bestanden komen gecomprimeerd sneller binnen; Next zet zelf
    # geen gzip op zijn antwoorden.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    auth_basic           $site_auth;
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Robots-Tag $robots_tag always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # 'unsafe-inline' bij script-src is nodig: Next zet zijn opstart- en
    # paginadata inline in de HTML. style-src idem voor de inline stijlen die
    # Motion tijdens animaties zet. Fonts worden lokaal geserveerd door
    # next/font, dus er hoeft geen Google-domein open te staan.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://veramiek.nl https://www.veramiek.nl; media-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # ── Werk- en previewpagina's nooit publiek ──
    location ^~ /preview- {
        return 404;
    }

    # ── Geuploade productfoto's ──
    # Aparte behandeling omdat /api/ hieronder no-store zet. Uploadnamen zijn
    # uniek (tijdstempel plus willekeurige bytes), dus ze mogen lang gecached
    # worden; anders haalt next/image ze telkens opnieuw op.
    location ^~ /api/uploads/ {
        proxy_pass http://veramiek-api-1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ── API ──
    location /api/ {
        proxy_pass http://veramiek-api-1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Bewust doorgeven in plaats van aanvullen: de API draait met
        # trust proxy 1 en pakt de laatste waarde. Zou deze proxy zijn eigen IP
        # toevoegen, dan zag de rate limiter iedereen als dezelfde bezoeker.
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Ruimer dan de site zelf, want /api/ serveert ook het adminpaneel
        # (admin.html): dat gebruikt Google Fonts en inline script/stijl.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://veramiek.nl; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── De Next-applicatie ──
    location / {
        # Een variabele in proxy_pass betekent dat nginx de naam pas tijdens de
        # aanvraag opzoekt in plaats van bij het starten. Dat vraagt een
        # expliciete resolver: 127.0.0.11 is de interne DNS van Docker.
        # Bijkomend voordeel: nginx start nu ook op als de preview-container er
        # niet is, waar hij vroeger op een onbekende naam zou weigeren.
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://$next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
