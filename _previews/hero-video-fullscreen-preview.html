<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>Veramiek — Hero video fullscreen preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Gruppo&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Playfair Display", serif; }

  .hero {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .hero video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Subtiele donkere filter voor leesbaarheid, multiply behoudt de kleurintensiteit van de video. */
  .hero-video-scrim {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.3);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  /* Header: wit in rust, wordt wijnrood bij hover over de hele streep. */
  .hero-header {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 92px;
    padding: 0 20px;
    background: #fff;
    color: #2F0410;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .hero-header:hover {
    background: #2F0410;
    color: #fff;
  }
  @media (min-width: 768px) {
    .hero-header { padding: 0 40px; }
  }

  .hero-logo-wrap {
    position: relative;
    height: 48px;
  }
  @media (min-width: 768px) {
    .hero-logo-wrap { height: 56px; }
  }

  .hero-logo {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: auto;
    transition: opacity 0.3s ease;
  }
  .hero-logo-white { opacity: 0; }
  .hero-header:hover .hero-logo-wine { opacity: 0; }
  .hero-header:hover .hero-logo-white { opacity: 1; }

  .hero-header-icons {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: inherit;
    opacity: 0.85;
    transition: opacity 0.3s ease;
  }
  .icon-btn:hover { opacity: 1; }

  /* Nav-links gecentreerd in de header. */
  .hero-nav {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 36px;
    font-family: "Gruppo", sans-serif;
    font-size: 1rem;
    letter-spacing: 0.03em;
  }
  .hero-nav a {
    color: inherit;
    text-decoration: none;
    opacity: 0.85;
    transition: opacity 0.3s ease;
  }
  .hero-nav a:hover { opacity: 1; }

  /* Social iconen rechtsonder, zelfde opzet als Hero.tsx. */
  .hero-social {
    position: absolute;
    right: 24px;
    bottom: 32px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 32px;
  }
  @media (min-width: 768px) {
    .hero-social { right: 48px; bottom: 40px; }
  }
  .hero-social a {
    color: #fff;
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .hero-social a:hover { transform: scale(1.08); color: #CBD1A1; }

  /* Groot wordmark linksonder, iets los van de onderrand. */
  .hero-wordmark-wrap {
    position: absolute;
    left: 24px;
    bottom: 32px;
    z-index: 20;
    display: inline-block;
  }
  @media (min-width: 768px) {
    .hero-wordmark-wrap { left: 48px; bottom: 40px; }
  }

  .hero-wordmark {
    margin: 0;
    color: #fff;
    font-weight: 700;
    font-size: clamp(7rem, 22vw, 18rem);
    line-height: 0.9;
    letter-spacing: 0.05em;
    transform: scaleY(1.25);
    transform-origin: bottom left;
  }

  /* Tagline op de hoogte van de bovenkant van VERAMIEK, rechts ervan, 3 regels. */
  .hero-tagline {
    position: absolute;
    top: 0;
    left: 100%;
    margin-left: 1.5rem;
    white-space: nowrap;
    font-family: "Gruppo", sans-serif;
    font-size: 0.85rem;
    line-height: 1.6;
    letter-spacing: 0.08em;
    color: #fff;
  }

  /* Collectierij vlak onder VERAMIEK, over de breedte van het woord: begin / midden / einde. */
  .hero-collections-row {
    width: 100%;
    margin-top: 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Gruppo", sans-serif;
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: #fff;
  }
</style>
</head>
