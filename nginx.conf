server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──
    # Let op: nginx erft add_header NIET over zodra een location-blok zelf een
    # add_header zet. Daarom staan deze headers hieronder herhaald in elk
    # location-blok dat eigen headers definieert (/api/ en *.html).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://veramiek.nl https://cdn.sanity.io blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Blokkeer gevoelige bestanden/mappen ──
    # Verborgen bestanden en mappen (.git, .env, .dockerignore, ...)
    location ~ /\. { deny all; }
    # Interne security-documentatie nooit publiek serveren
    location ^~ /security/ { deny all; }
    # Config-, broncode-, docs- en mediafiles die niet publiek horen
    location ~* \.(ya?ml|conf|md|log|sh|example|mp3)$ { deny all; }
    # Oude/duplicaat pagina niet serveren
    location = /index-v2.html { deny all; }

    location /api/ {
        proxy_pass http://api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;

        # Security headers herhaald (zie toelichting bovenaan)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://veramiek.nl https://cdn.sanity.io blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ~* \.html$ {
        # Security headers herhaald (zie toelichting bovenaan)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://veramiek.nl https://cdn.sanity.io blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
